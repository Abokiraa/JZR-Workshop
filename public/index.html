<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Safety Culture — Live Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e151b;
    --steel:#1c2933;
    --steel-2:#26343f;
    --paper:#eef2f1;
    --paper-dim:#c9d3d1;
    --amber:#f2a71b;
    --caution:#d9503d;
    --safe:#3fa796;
    --line: rgba(238,242,241,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;}

  .stripe{
    height:8px;
    background: repeating-linear-gradient(135deg, var(--amber) 0 14px, var(--ink) 14px 28px);
  }

  .screen{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- role select ---------- */
  .role-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .role-card{
    max-width:520px;width:100%;text-align:center;
  }
  .tag-badge{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--steel-2);border:1px solid var(--line);
    padding:6px 14px;border-radius:3px;
    font-size:12px;color:var(--amber);
  }
  .tag-badge::before{content:"◆";font-size:10px;}
  h1.display{
    font-size:clamp(32px,6vw,52px);
    margin:18px 0 8px;
    line-height:1.05;
    color:var(--paper);
  }
  .sub{color:var(--paper-dim);font-size:15px;margin-bottom:32px;}
  .role-buttons{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
  .btn{
    padding:16px 28px;
    border-radius:4px;
    font-size:16px;
    font-weight:600;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--amber);color:var(--ink);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;color:var(--paper);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--paper-dim);}
  .btn-join{background:var(--safe);color:var(--ink);border:1px solid var(--safe);font-weight:600;}
  .btn-join:hover{filter:brightness(1.1);}

  input[type=text]{
    width:100%;padding:14px 16px;border-radius:4px;border:1px solid var(--line);
    background:var(--steel);color:var(--paper);font-size:16px;margin-bottom:14px;
  }
  input[type=text]:focus{outline:2px solid var(--amber);outline-offset:1px;}

  /* ---------- header bar shared ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;border-bottom:1px solid var(--line);
    background:var(--steel);
  }
  .topbar .qcode{color:var(--amber);font-size:20px;}
  .topbar .prog{color:var(--paper-dim);font-size:18px;}

  /* ---------- host / projector view ---------- */
  .host-main{flex:1;display:flex;flex-direction:column;align-items:center;padding:48px clamp(24px,6vw,80px);text-align:center;}
  .qtype-tag{
    display:inline-block;font-size:16px;padding:6px 16px;border-radius:4px;
    border:1px solid var(--line);color:var(--paper-dim);margin-bottom:26px;
  }
  .qtype-tag.knowledge{color:var(--safe);border-color:var(--safe);}
  .qtype-tag.poll{color:var(--amber);border-color:var(--amber);}
  h2.qtext{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size:clamp(34px,5vw,68px);
    line-height:1.18;
    margin:0 0 44px;
    max-width:1300px;
  }
  .bars{display:flex;flex-direction:column;gap:20px;max-width:1300px;width:100%;}
  .bar-row{display:flex;flex-direction:column;gap:8px;}
  .bar-label{
    display:flex;justify-content:space-between;font-size:24px;color:var(--paper);
  }
  .bar-label .count{color:var(--paper-dim);font-family:'IBM Plex Mono',monospace;font-size:20px;}
  .bar-track{
    height:52px;background:var(--steel-2);border-radius:5px;overflow:hidden;
    border:1px solid var(--line);
  }
  .bar-fill{
    height:100%;background:var(--amber);
    transition:width .5s ease;
    min-width:2px;
  }
  .bar-fill.correct{background:var(--safe);}
  .totalvotes{margin-top:30px;color:var(--paper-dim);font-size:18px;}
  .host-controls{
    display:flex;gap:12px;padding:22px clamp(20px,5vw,72px);border-top:1px solid var(--line);
    background:var(--steel);flex-wrap:wrap;align-items:center;
  }
  .host-controls .spacer{flex:1;}

  /* ---------- participant view ---------- */
  .p-main{flex:1;display:flex;flex-direction:column;padding:26px 20px;max-width:560px;margin:0 auto;width:100%;}
  .p-qtext{
    font-family:'Oswald',sans-serif;font-weight:500;
    font-size:clamp(22px,6vw,28px);line-height:1.2;margin:14px 0 24px;
  }
  .opt-btn{
    display:block;width:100%;text-align:left;
    background:var(--steel);border:1px solid var(--line);color:var(--paper);
    padding:16px 18px;border-radius:4px;font-size:16px;margin-bottom:12px;
    transition:border-color .15s ease, background .15s ease;
  }
  .opt-btn:hover{border-color:var(--amber);}
  .opt-btn.selected{background:var(--amber);color:var(--ink);border-color:var(--amber);font-weight:600;}
  .opt-key{
    display:inline-block;width:22px;color:var(--paper-dim);font-family:'IBM Plex Mono',monospace;
    font-size:13px;margin-right:8px;
  }
  .opt-btn.selected .opt-key{color:var(--ink);}
  .multi-hint{color:var(--paper-dim);font-size:12px;margin:-14px 0 16px;}
  .select-all-hint{color:var(--amber);font-size:18px;margin:0 0 30px;letter-spacing:0.04em;}
  .submit-btn{width:100%;margin-top:8px;padding:16px;font-size:16px;}
  .waitbox{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;
  }
  .waitbox .check{
    width:56px;height:56px;border-radius:50%;background:var(--safe);
    display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink);
  }
  .waitbox p{color:var(--paper-dim);font-size:14px;}

  .footer-note{
    text-align:center;color:var(--paper-dim);font-size:11px;padding:14px;
  }
  .spotlight{
    margin-top:34px;max-width:1300px;padding:28px 32px;border-radius:6px;
    background:linear-gradient(90deg, rgba(242,167,27,0.14), var(--steel-2));
    border:1px solid var(--amber);
  }
  .spotlight .who{
    font-family:'Oswald',sans-serif;font-size:30px;color:var(--amber);margin:0 0 10px;
  }
  .spotlight .prompt{font-size:24px;line-height:1.4;margin:0;}
  .name-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .name-chip{
    padding:8px 16px;border-radius:20px;background:var(--steel);border:1px solid var(--line);
    color:var(--paper);font-size:14px;
  }
  .name-chip:hover{border-color:var(--amber);color:var(--amber);}
  .diamond{
    position:fixed;top:0;right:0;width:0;height:0;
    border-style:solid;border-width:0 46px 46px 0;
    border-color:transparent var(--amber) transparent transparent;
    opacity:.9;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// If window.storage isn't provided by the environment (i.e. we're running on a
// local/self-hosted server instead of inside a Claude.ai artifact), fall back
// to a tiny REST-backed shim with the same shape, talking to our own server.js.
if(!window.storage){
  // Only when self-hosted (not in a Claude.ai artifact): forward any JS error
  // straight to the terminal running server.js, so you don't need browser dev tools.
  function reportError(payload){
    fetch("/api/log-error", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    }).catch(()=>{});
  }
  window.addEventListener("error", (e) => {
    reportError({
      message: e.message,
      source: e.filename,
      line: e.lineno,
      col: e.colno,
      stack: e.error && e.error.stack
    });
  });
  window.addEventListener("unhandledrejection", (e) => {
    reportError({
      message: "Unhandled promise rejection: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason)),
      stack: e.reason && e.reason.stack
    });
  });

  window.storage = {
    async get(key, shared){
      const res = await fetch(`/api/storage/${encodeURIComponent(key)}`);
      if(res.status === 404) throw new Error("not found: " + key);
      return await res.json();
    },
    async set(key, value, shared){
      const res = await fetch(`/api/storage/${encodeURIComponent(key)}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({value})
      });
      if(!res.ok) throw new Error("storage set failed");
      return await res.json();
    },
    async delete(key, shared){
      const res = await fetch(`/api/storage/${encodeURIComponent(key)}`, {method:"DELETE"});
      if(!res.ok) throw new Error("storage delete failed");
      return await res.json();
    },
    async list(prefix, shared){
      const res = await fetch(`/api/storage?prefix=${encodeURIComponent(prefix||"")}`);
      if(!res.ok) throw new Error("storage list failed");
      return await res.json();
    }
  };
}
</script>
<script>
const OPT_KEYS = ["A","B","C","D"];

const DISCUSSION = [
  "Ever think that being careless today could leave a colleague's kid without a dad tomorrow?",
  "How do we look out for each other without it turning into a lecture — so it actually feels like we care?",
  "Imagine staying quiet about a small hazard today, and tomorrow it happens to your closest workmate. How would that sit with you?",
  "How do we get leaders to understand that punishing someone who made an honest mistake just buries the real problem instead of fixing it?",
  "How do we build a place where someone can say \"no, this isn't safe\" without worrying about their job?",
  "When's the last time you wish you'd stopped a job — and didn't? What'd you learn from it?",
  "When did being \"nice\" about small stuff around here actually turn into something dangerous?",
  "How do we make \"Safety First\" mean something real for the guys out in the field, not just a sign on the wall?",
  "Got an example of a procedure that feels like it's just there to cover the company legally? How could we make it actually work?",
  "What's the one honest thing you'd want leadership to hear right now about your safety out there?"
];

const QUESTIONS = [
  {
    type:"poll",
    text:"Imagine you had to call a colleague's family after an accident — because his shift was careless and you stayed quiet. What would be the hardest thing to say?",
    options:["\"I saw him being careless and didn't speak up\"","\"We cared more about getting the job done than bringing him home safe\"","\"The system is just paperwork — it didn't protect him\"","Honestly, I don't think I could even make that call"]
  },
  {
    type:"poll",
    text:"You see a close workmate being careless about a clear safety rule. What do you actually do?",
    options:["Speak up right away, straight up","Bring it up gently, maybe with a joke","Stay quiet — he's a grown man, his call","Feel uneasy but too awkward to say anything"]
  },
  {
    type:"poll",
    text:"When something almost goes wrong and we decide not to report it... what's the excuse we tell ourselves?",
    options:["Nothing happened, so who cares","I'm scared of getting blamed or investigated","Reporting never changes anything anyway","The paperwork's too much hassle"]
  },
  {
    type:"poll",
    text:"You make an honest mistake while genuinely trying to do the job right. What hurts the most about how leadership reacts?",
    options:["Being treated like I'm guilty before anyone even asks what happened","Threats to my job with zero understanding","They support me and blame the system that set me up to fail","The way colleagues look at me differently afterward"]
  },
  {
    type:"poll",
    text:"You're under serious pressure — the job's behind, management's pushing. What actually wins in your head in that moment?",
    options:["Common sense: getting home safe matters more than anything","Fear of upsetting management, so I just push through","I freeze up and hope it works out","I give in and just do what they want"]
  },
  {
    type:"poll",
    text:"When is it hardest to say \"stop, this isn't safe\"?",
    options:["When my supervisor brushes it off or mocks me","When my team just wants to finish and go home","When I'm not 100% sure it's actually dangerous","When I know it means hours of questions afterward"]
  },
  {
    type:"poll",
    text:"When we let each other's small mistakes slide so we don't seem difficult, what are we really doing?",
    options:["Setting up the next big accident","Teaching each other that cutting corners is fine","Trading real safety for being liked","Risking someone's life just to keep the peace"]
  },
  {
    type:"poll",
    text:"Safety First signs are everywhere. Be honest — when does that phrase feel like just a poster on the wall?",
    options:["When we're behind schedule and suddenly it's \"just get it done\"","When money goes to everything except basic maintenance","When the fast, reckless guy gets praised over the careful one","When a procedure's impossible to follow but we still have to sign it"]
  },
  {
    type:"poll",
    text:"Some procedures feel way too complicated. What's your honest take on that?",
    options:["Feels like it's there to protect the company, not me","It asks for things that just can't all happen at once","Nobody actually asks the guys doing the work what they think","I quietly find my own safer way around it"]
  },
  {
    type:"poll",
    text:"Which of the below need more focus to make you confident that is is a safe place to spend your whole career?",
    options:["When leadership delays a job just to keep us safe","When a mistake gets a coaching conversation, not a scapegoat","When my ideas from the field actually get listened to","When personal life and well-being are genuinely respected, not just on paper"]
  }
];

let participantId = null;
function getParticipantId(){
  if(!participantId){
    participantId = "p_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }
  return participantId;
}

const app = document.getElementById("app");
let role = null; // 'host' | 'participant'
let pollTimer = null;

function render(html){ app.innerHTML = html; }

// ---------- ROLE SELECT ----------
function renderRoleSelect(){
  const isAdmin = new URLSearchParams(window.location.search).get("admin") === "1";
  render(`
    <div class="diamond"></div>
    <div class="screen">
      <div class="role-wrap">
        <div class="role-card">
          <span class="tag-badge mono">JZR SAFETY CULTURE WORKSHOP</span>
          <h1 class="display">Live Session</h1>
          <p class="sub"></p>
          <div class="role-buttons">
            ${isAdmin ? '<button class="btn btn-primary" onclick="startHost()">⚙ Admin — control the session</button>' : ''}
            <button class="btn btn-join" onclick="showJoin()">Join Here</button>
          </div>
        </div>
      </div>
      <div class="stripe"></div>
    </div>
  `);
}

function showJoin(){
  render(`
    <div class="screen">
      <div class="role-wrap">
        <div class="role-card">
          <span class="tag-badge mono">JOINING SESSION</span>
          <h1 class="display" style="font-size:30px;">Enter your name</h1>
          <p class="sub">Write Yor Name/Org</p>
          <input type="text" id="nameInput" placeholder="e.g. Ahmad" />
          <div class="role-buttons">
            <button class="btn btn-primary" onclick="startParticipant()">Join session</button>
          </div>
        </div>
      </div>
      <div class="stripe"></div>
    </div>
  `);
}

let participantName = "";

// ---------- HOST ----------
let hostQIndex = 0;
let hostRevealed = false;
let hostSpotlight = null; // {name, prompt}
let QUESTION_ORDER = QUESTIONS.map((_, i) => i); // default: original order, until shuffled

function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getQuestion(pos){ return QUESTIONS[QUESTION_ORDER[pos]]; }
function getDiscussion(pos){ return DISCUSSION[QUESTION_ORDER[pos]]; }

// host: shuffle fresh and publish it; participant: just read whatever's published
async function ensureQuestionOrder(forceNewShuffle){
  if(forceNewShuffle){
    QUESTION_ORDER = shuffleArray(QUESTIONS.map((_, i) => i));
    try{
      await window.storage.set("question-order", JSON.stringify(QUESTION_ORDER), true);
    }catch(e){}
  }else{
    try{
      const r = await window.storage.get("question-order", true);
      if(r && r.value) QUESTION_ORDER = JSON.parse(r.value);
    }catch(e){}
  }
}

async function startHost(){
  role = "host";
  await ensureQuestionOrder(true); // fresh shuffle every time a session starts
  hostQIndex = 0;
  await window.storage.set("current-question", "0", true);
  hostRevealed = false;
  renderHost();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshHostVotes, 2200);
}

async function fetchVoteTally(qIndex){
  const tally = new Array(getQuestion(qIndex).options.length).fill(0);
  let total = 0;
  try{
    const listRes = await window.storage.list(`vote:${qIndex}:`, true);
    const keys = (listRes && listRes.keys) || [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value !== undefined){
          const data = JSON.parse(r.value);
          // support both new multi-select format {options:[...]} and old single-select {option:n}
          const picks = Array.isArray(data.options) ? data.options : (typeof data.option === "number" ? [data.option] : []);
          if(picks.length > 0){
            total++; // count respondents, not selections
            for(const p of picks){
              if(typeof p === "number" && p >= 0 && p < tally.length) tally[p]++;
            }
          }
        }
      }catch(e){}
    }
  }catch(e){}
  return {tally, total};
}

async function refreshHostVotes(){
  if(role !== "host") return;
  const {tally, total} = await fetchVoteTally(hostQIndex);
  updateHostBars(tally, total);
}

function renderHost(){
  const q = getQuestion(hostQIndex);
  render(`
    <div class="diamond"></div>
    <div class="screen">
      <div class="topbar">
        <span class="mono qcode">Q-${String(hostQIndex+1).padStart(2,'0')}</span>
        <span class="prog mono">${hostQIndex+1} / ${QUESTIONS.length}</span>
      </div>
      <div class="host-main">
        <span class="qtype-tag ${q.type}">${q.type === 'knowledge' ? 'ALIGN ON TERMS' : 'OPEN FLOOR'}</span>
        <h2 class="qtext">${q.text}</h2>
        <p class="select-all-hint mono">Select all answers that apply</p>
        <div class="bars" id="hostBars"></div>
        <div class="totalvotes mono" id="hostTotal">0 votes recorded</div>
        <div id="spotlightArea">${hostSpotlight ? `
          <div class="spotlight">
            <p class="who mono">🎤 ${escapeHtml(hostSpotlight.name)}</p>
            <p class="prompt">${hostSpotlight.prompt}</p>
          </div>
        ` : ''}</div>
      </div>
      <div class="host-controls">
        <button class="btn btn-ghost" onclick="hostPrev()" ${hostQIndex===0?'disabled style="opacity:.4"':''}>← Prev</button>
        ${q.type==='knowledge' ? `<button class="btn btn-ghost" onclick="toggleReveal()">${hostRevealed ? 'Hide answer' : 'Reveal correct answer'}</button>` : ''}
        <div class="spacer"></div>
        <button class="btn btn-ghost" onclick="pickRandomSpeaker()">🎤 Pick random speaker</button>
        <button class="btn btn-ghost" onclick="resetQuestion()">Reset votes</button>
        <button class="btn btn-primary" onclick="hostNext()" ${hostQIndex===QUESTIONS.length-1?'disabled style="opacity:.4"':''}>Next →</button>
      </div>
      <div class="stripe"></div>
    </div>
  `);
  refreshHostVotes();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function updateHostBars(tally, total){
  const barsEl = document.getElementById("hostBars");
  const totalEl = document.getElementById("hostTotal");
  if(!barsEl) return;
  const q = getQuestion(hostQIndex);
  const max = Math.max(1, ...tally);
  barsEl.innerHTML = q.options.map((opt,i)=>{
    const pct = total>0 ? Math.round((tally[i]/total)*100) : 0;
    const widthPct = Math.round((tally[i]/max)*100);
    const isCorrect = q.type==='knowledge' && hostRevealed && i===q.correct;
    return `
      <div class="bar-row">
        <div class="bar-label">
          <span><span class="opt-key mono">${OPT_KEYS[i]}</span>${opt}${isCorrect?' ✓':''}</span>
          <span class="count">${tally[i]} · ${pct}%</span>
        </div>
        <div class="bar-track"><div class="bar-fill ${isCorrect?'correct':''}" style="width:${widthPct}%"></div></div>
      </div>
    `;
  }).join("");
  if(totalEl) totalEl.textContent = `${total} vote${total===1?'':'s'} recorded`;
}

async function pickRandomSpeaker(){
  let voters = [];
  try{
    const listRes = await window.storage.list(`vote:${hostQIndex}:`, true);
    const keys = (listRes && listRes.keys) || [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value){
          const data = JSON.parse(r.value);
          voters.push(data.name || "Anonymous");
        }
      }catch(e){}
    }
  }catch(e){}
  const area = document.getElementById("spotlightArea");
  if(!area) return;
  if(voters.length === 0){
    area.innerHTML = `<div class="spotlight"><p class="prompt">No one has answered yet. Wait a moment and try again.</p></div>`;
    return;
  }
  const uniqueVoters = [...new Set(voters)];
  const pick = uniqueVoters[Math.floor(Math.random() * uniqueVoters.length)];
  hostSpotlight = {name: pick, prompt: getDiscussion(hostQIndex)};
  area.innerHTML = `
    <div class="spotlight">
      <p class="who mono">🎤 ${escapeHtml(hostSpotlight.name)}</p>
      <p class="prompt">${hostSpotlight.prompt}</p>
    </div>
  `;
}

async function hostNext(){
  if(hostQIndex < QUESTIONS.length-1){
    hostQIndex++; hostRevealed = false; hostSpotlight = null;
    await window.storage.set("current-question", String(hostQIndex), true);
    renderHost();
  }
}
async function hostPrev(){
  if(hostQIndex > 0){
    hostQIndex--; hostRevealed = false; hostSpotlight = null;
    await window.storage.set("current-question", String(hostQIndex), true);
    renderHost();
  }
}
function toggleReveal(){
  hostRevealed = !hostRevealed;
  renderHost();
}
async function resetQuestion(){
  try{
    const listRes = await window.storage.list(`vote:${hostQIndex}:`, true);
    const keys = (listRes && listRes.keys) || [];
    for(const k of keys){
      try{ await window.storage.delete(k, true); }catch(e){}
    }
  }catch(e){}
  refreshHostVotes();
}

// ---------- PARTICIPANT ----------
let pQIndex = -1;
let pSelected = null;

async function startParticipant(){
  const nameEl = document.getElementById("nameInput");
  participantName = nameEl ? nameEl.value.trim() : "";
  role = "participant";
  pQIndex = -1;
  pSelected = null;
  renderParticipantLoading();
  await ensureQuestionOrder(false); // read whatever order the host has published
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollCurrentQuestion, 1800);
  pollCurrentQuestion();
}

function renderParticipantLoading(){
  render(`
    <div class="screen">
      <div class="waitbox">
        <p class="mono" style="color:var(--paper-dim)">Connecting to session…</p>
      </div>
    </div>
  `);
}

async function pollCurrentQuestion(){
  if(role !== "participant") return;
  await ensureQuestionOrder(false); // keep the shared order in sync every cycle
  let idx = 0;
  try{
    const r = await window.storage.get("current-question", true);
    idx = r ? parseInt(r.value,10) || 0 : 0;
  }catch(e){ idx = 0; }
  if(idx !== pQIndex){
    pQIndex = idx;
    pSelected = null;
    renderParticipantQuestion();
  }
}

let pSelectedSet = new Set();

function renderParticipantQuestion(){
  const q = getQuestion(pQIndex);
  pSelectedSet = new Set();
  render(`
    <div class="screen">
      <div class="topbar">
        <span class="mono qcode">Q-${String(pQIndex+1).padStart(2,'0')}</span>
        <span class="prog mono">${pQIndex+1} / ${QUESTIONS.length}</span>
      </div>
      <div class="p-main">
        <span class="qtype-tag ${q.type}">${q.type === 'knowledge' ? 'ALIGN ON TERMS' : 'OPEN FLOOR'}</span>
        <h2 class="p-qtext">${q.text}</h2>
        <p class="multi-hint mono">Pick one or more, then submit</p>
        <div id="optWrap">
          ${q.options.map((opt,i)=>`
            <button class="opt-btn" id="opt-${i}" onclick="toggleOption(${i})">
              <span class="opt-key mono">${OPT_KEYS[i]}</span>${opt}
            </button>
          `).join("")}
        </div>
        <button class="btn btn-primary submit-btn" onclick="submitVote()">Submit answers</button>
      </div>
      <div class="footer-note mono">${participantName ? 'Joined as ' + participantName : 'Joined anonymously'}</div>
    </div>
  `);
}

function toggleOption(i){
  if(pSelectedSet.has(i)) pSelectedSet.delete(i);
  else pSelectedSet.add(i);
  const btn = document.getElementById(`opt-${i}`);
  if(btn) btn.classList.toggle("selected", pSelectedSet.has(i));
}

async function submitVote(){
  if(pSelectedSet.size === 0) return; // require at least one pick
  const selected = [...pSelectedSet];
  const key = `vote:${pQIndex}:${getParticipantId()}`;
  try{
    await window.storage.set(key, JSON.stringify({options: selected, name: participantName || "Anonymous"}), true);
  }catch(e){}
  renderParticipantWaiting();
}

function renderParticipantWaiting(){
  render(`
    <div class="screen">
      <div class="topbar">
        <span class="mono qcode">Q-${String(pQIndex+1).padStart(2,'0')}</span>
        <span class="prog mono">${pQIndex+1} / ${QUESTIONS.length}</span>
      </div>
      <div class="waitbox">
        <div class="check">✓</div>
        <h2 class="p-qtext" style="font-size:20px;margin:0;">Vote recorded</h2>
        <p>Watch the screen — waiting for the next question…</p>

      </div>
    </div>
  `);
}
